services:
  # 1. Express Backend Web Service
  - type: web
    name: foodsave-backend
    runtime: node
    plan: free
    rootDir: Backend
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy && node prisma/seed.js
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: foodsave-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

  # 2. Vite React Frontend Static Site
  - type: web
    name: foodsave-frontend
    runtime: static
    plan: free
    rootDir: Frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
      - type: rewrite
        source: /
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: foodsave-backend
          property: host

databases:
  # 3. PostgreSQL Managed Database
  - name: foodsave-db
    plan: free
    databaseName: foodsave
    user: foodsave_user
